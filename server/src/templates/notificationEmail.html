<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>
</head>
<body style="margin: 0; padding: 0; background-color: #121212; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased;">

<table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0" style="background-color: #121212; padding: 40px 15px;">
    <tr>
        <td align="center">

            <table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0" style="max-width: 500px; background-color: #1C1B1B; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 24px; overflow: hidden;">
                <tr>
                    <td height="3" style="background: linear-gradient(90deg, #DBB668 0%, #c9a155 50%, #1C1B1B 100%); line-height: 3px; font-size: 3px;">&nbsp;</td>
                </tr>
                <tr>
                    <td style="padding: 32px 32px 20px 32px; text-align: center;">
                        <p style="margin: 0; color: #9ca3af; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 2.5px;">
                            Cut Hut Barbershop
                        </p>
                        <h1 style="margin: 6px 0 0 0; color: #F2EFE9; font-size: 26px; font-weight: 700; font-family: 'Playfair Display', Georgia, serif; letter-spacing: -0.5px;">
                            {{title}}
                        </h1>
                    </td>
                </tr>

                <tr>
                    <td style="padding: 0 32px;">
                        <div style="height: 1px; background-color: rgba(255, 255, 255, 0.06); margin: 0;"></div>
                    </td>
                </tr>

                <tr>
                    <td style="padding: 28px 32px;">
                        <div style="background-color: #262424; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.05); padding: 20px;">
                            <p style="margin: 0; color: #d1d5db; font-size: 15px; line-height: 1.6;">
                                {{message}}
                            </p>
                        </div>
                    </td>
                </tr>

                <tr>
                    <td style="padding: 20px 32px 28px 32px; border-top: 1px solid rgba(255, 255, 255, 0.06); text-align: center;">
                        <p style="margin: 0; color: #6b7280; font-size: 12px; line-height: 1.5;">
                            This is an automated notification from Cut Hut.<br>
                            © 2026 Cut Hut. All rights reserved.
                        </p>
                    </td>
                </tr>

            </table>

        </td>
    </tr>
</table>

</body>
</html>
